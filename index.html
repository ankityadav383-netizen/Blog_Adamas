<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Adamas Tech Consulting</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="hero">
    <h1>Explore our blog for expert knowledge and inspiration</h1>
    <p>Stay connected with us by subscribing to our blog updates. By doing so, you'll receive notifications whenever we publish new articles.</p>
  </section>

  <nav class="category-filter" id="categoryFilter" aria-label="Filter blog posts by category"></nav>

  <main class="blog-section">
    <div class="blog-grid" id="blogGrid"></div>
    <div class="load-more-wrap" id="loadMoreWrap">
      <button class="btn btn-outline" id="loadMoreBtn">Load More Blogs</button>
    </div>
  </main>

  <section class="cta-banner" id="cta-banner"></section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/layout.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/cms.js"></script>
  <script src="js/blog-listing.js"></script>
</body>
</html>
